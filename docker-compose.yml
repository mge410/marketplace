services:
  web:
    container_name: backend
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    container_name: db
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"  # Основной порт для всех AWS сервисов
    environment:
      - SERVICES=s3  # Укажите необходимые AWS сервисы через запятую (например, s3,sns,sqs)
      - DEBUG=1  # Можно установить в 1 для подробного логирования при отладке
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
      - LS_LOG=info
      - AWS_ACCESS_KEY_ID=dev_s3_id
      - AWS_SECRET_ACCESS_KEY=dev_s3_key
      - AWS_DEFAULT_REGION=eu-central-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"  # Для возможности создавать другие контейнеры (нужно для некоторых сервисов, например, Lambda)
      - "./localstack_init_scripts:/etc/localstack/init/state.d"  # Папка с скриптами инициализации (например, для создания бакетов)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]  # Или использовать awslocal
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
  localstack_data:
